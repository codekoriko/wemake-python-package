[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "wemake-python-package"
description = "Bleeding edge cookiecutter template to create new python packages"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
readme = "README.md"
authors = [
  { name = "Killian Blais", email = "codekoriko@users.noreply.github.com" },
]
license = "MIT"
dynamic = ["dependencies", "classifiers"]


[tool.poetry]
package-mode = false
classifiers = [
  "Private :: Do not Upload",
]


[tool.poetry.dependencies]
cookiecutter = "^2.6"
jinja2-git = "^1.4"
lice = "^0.6"
setuptools = "*"

[tool.poetry.group.dev.dependencies]
binaryornot = "^0.4"
tomli = "^2.2"

wemake-python-styleguide = "^1.3"
ruff = "^0.12"

mypy = "^1.17"

pytest = "^8.4"
pytest-randomly = "^3.16"
pytest-cookies = "^0.7"
pyright = "^1.1.404"


[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
target-version = "py310"
line-length = 80
extend-exclude = [
  # Internal project:
  '[{][{]cookiecutter.project_name[}][}]',
]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",   # allow to shadow stdlib and builtin module names
  "COM812", # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "TRY003",  # long exception messages from `tryceratops`
]
external = [ "WPS" ]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101", # asserts
]


[tool.pytest.ini_options]
# pytest config: http://doc.pytest.org/en/latest/customize.html

# Strict `@xfail` by default:
xfail_strict = true
# Fail on warnings:
filterwarnings = ["error"]

addopts = [
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  "--tb=short",
  # Custom template parts:
  "--ignore={{cookiecutter.project_name}}",
  "--ignore=hooks",
  # Coverage:
  "--cov-fail-under=85",
]


[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
strict = true
strict_bytes = true
local_partial_types = true
warn_unreachable = true

exclude = [
  '{{cookiecutter.project_name}}',
]

enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "mutable-override",
  "unimported-reveal",
  "deprecated",
]

[tool.poe.tasks]
py-lint-flake8 = "flake8 ."
py-lint-ruff = "ruff check . --fix"
md-lint = "markdownlint . --fix"
type-check-mypy = "mypy ."
# vscode used for Pylance langage server
type-check-pyright = "pyright ."
test = "pytest"
# to reduce token usage, we don't include coverage report in agent tests
# Run tests quietly, suppress standard reports, then print ONLY the total coverage percentage
test-agent = { sequence = [
  { cmd = "pytest -o 'addopts=--quiet' --cov-report=" },
  { cmd = "coverage report --format=total --precision=2" },
], help = "Run tests with minimal output for agents" }
test-single = "pytest -q"
generate-wordlist-dataframe = { "script" = "passphrase_generator.word_list:generate_wordlist" }

# Combine everything
check-all = { sequence = [
  "py-lint-ruff",
  "py-lint-flake8",
  "md-lint",
  "type-check-mypy",
  "type-check-pyright",
], help = "Run all linting, type-checking, and tests" }
